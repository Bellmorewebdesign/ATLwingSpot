<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22c1da" />

    <!-- The design is light-only. Without this, a phone in dark mode can repaint
         the page itself (Chrome's "darken websites", Samsung Internet, in-app
         browsers): the cream turns brown, the menu icon goes black on dark and
         brand colours shift. "only light" is the standard way to opt out.
         tokens.css says the same thing in CSS. -->
    <meta name="color-scheme" content="only light" />
    <!-- Every phone number on the site is already a tap-to-call link. This stops
         iOS Safari turning other digit runs (ZIPs, prices, years) into blue
         links of its own. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- ATL's own "atl" lozenge on a cyan tile inside the orange keyline from
         their basket stamp. Built by app/scripts/make-favicon.py straight from
         assets/brand/atl-wing-spot-logo.png. Paths are relative so they resolve
         under the GitHub Pages project subpath. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/atl-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/brand/atl-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/brand/atl-apple-touch-icon.png" />

    <title>ATL Wing Spot | Stay Saucy. Fresh, Never Frozen. 100% Halal.</title>
    <meta name="description" content="Fresh, never frozen wings in 25+ flavors at ATL Wing Spot. 100% Halal. Voted Best Wings on Long Island. Pickup and delivery across NY, NJ and CA. Order now." />

    <meta property="og:type" content="restaurant" />
    <meta property="og:title" content="ATL Wing Spot | Stay Saucy." />
    <meta property="og:description" content="Fresh, never frozen wings in 25+ flavors. 100% Halal. Voted Best Wings on Long Island. Order pickup or delivery." />
    <meta property="og:image" content="./assets/food/hero-wings.jpg" />
    <meta property="og:site_name" content="ATL Wing Spot" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATL Wing Spot | Stay Saucy." />
    <meta name="twitter:description" content="Fresh, never frozen wings in 25+ flavors. 100% Halal. Voted Best Wings on Long Island." />
    <meta name="twitter:image" content="./assets/food/hero-wings.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "ATL Wing Spot",
        "servesCuisine": ["Wings", "American", "Halal"],
        "image": "./assets/food/hero-wings.jpg",
        "hasMenu": "./#/menu",
        "acceptsReservations": false,
        "sameAs": [
          "https://www.instagram.com/atlwingspot/",
          "https://www.tiktok.com/@atlwingspot"
        ],
        "potentialAction": {
          "@type": "OrderAction",
          "target": "https://order.snackpass.co/atlwingspot"
        }
      }
    </script>
    <script type="module" crossorigin src="./static/index-DthpAhud.js"></script>
    <link rel="stylesheet" crossorigin href="./static/index-CwXTZqVI.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
