<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#29c1db">
  <title>Sign in</title>
  <!-- Same icon set as atlwingspot.com (app/public/assets/brand). -->
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="brand/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png">
  <link rel="preload" href="fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="signin.js" defer></script>
</head>
<body>

  <!-- Sign in: the only thing on this page. The inputs have no name
       attribute and the form posts nowhere,
       so even if the script failed to load, the password could never end up
       in a URL. -->
  <section id="signin" class="signin" hidden>
    <div class="signin-card">
      <img class="signin-logo" src="brand/logo.png" alt="ATL Wing Spot" width="560" height="246">
      <h1 class="display">Sign <span class="t-orange">in.</span></h1>

      <form id="signin-form" class="stack" method="post" action="#" novalidate>
        <label class="field">Username
          <input id="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        </label>
        <label class="field">Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="signin-error" class="error" role="alert" hidden></p>
        <button class="btn btn-lg wide" type="submit"><span class="label">Sign in</span> <span class="ar" aria-hidden="true">→</span></button>
      </form>

      <!-- Extra step, only if the account needs it: a new password, or an
           authenticator-app code when MFA is switched on. -->
      <form id="challenge-form" class="stack" method="post" action="#" novalidate hidden>
        <p id="challenge-text" class="challenge-text"></p>
        <p id="challenge-key" class="key" hidden></p>
        <label class="field"><span id="challenge-label">Code</span>
          <input id="challenge-input" autocomplete="one-time-code" required>
        </label>
        <p id="challenge-error" class="error" role="alert" hidden></p>
        <button class="btn btn-lg wide" type="submit"><span class="label">Continue</span> <span class="ar" aria-hidden="true">→</span></button>
        <button id="challenge-cancel" class="linkish" type="button">Start over</button>
      </form>
    </div>
  </section>

  <!-- The dashboard is not part of this page. After sign-in, signin.js
       fetches it from /api/app/ (only with a valid one-time pass) into here. -->
  <div id="app-root"></div>
</body>
</html>
