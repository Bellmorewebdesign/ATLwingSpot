AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ATL Wing Spot franchise dashboard, phase 2. A login-protected page for the
  submissions that the archive stack (atl-franchise-archive) saves. Separate
  stack, so the dashboard can be changed or rebuilt without touching capture.
  See ../PLAN.md.

Parameters:
  TableName:
    Type: String
    Default: atl-franchise-submissions
    Description: The submissions table created by the archive stack.
  DomainName:
    Type: String
    Default: ''
    Description: >
      Optional custom hostname, e.g. admin.atlwingspot.com. Leave empty on the
      first deploy; the dashboard is then served on its cloudfront.net address.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate (us-east-1) for DomainName. Required with DomainName.
    AllowedPattern: '^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: must be empty or an ACM certificate ARN in us-east-1
  RequireMfa:
    Type: String
    Default: 'OFF'
    AllowedValues: ['ON', 'OFF']
    Description: >
      ON makes every login also ask for a 6-digit code from an authenticator
      app; the first login after switching it on shows a key to add to the
      app. Recommended for personal data. Can be switched at any redeploy.

  EnableWaf:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      AWS WAF in front of the dashboard and the login: per-IP rate limits plus
      AWS's lists of known-bad IPs and attack patterns. About $15 a month;
      'false' removes it.

Rules:
  DomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: CertificateArn is required when DomainName is set.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  MfaOn: !Equals [!Ref RequireMfa, 'ON']
  WafOn: !Equals [!Ref EnableWaf, 'true']

Resources:

  # ------------------------------------------------------------------ audit
  # Who changed what, when. Written only by the API; nothing else can.
  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: atl-franchise-audit
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: submissionId, AttributeType: S }
        - { AttributeName: at,           AttributeType: S }
      KeySchema:
        - { AttributeName: submissionId, KeyType: HASH }
        - { AttributeName: at,           KeyType: RANGE }

  # One row per sign-in: when, from where (IP and place), on what (browser,
  # OS). Signing a device out marks its row and the API refuses it from then
  # on. Rows drop out of the log 30 days after the device was last seen.
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: atl-franchise-sessions
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: sid, AttributeType: S }
      KeySchema:
        - { AttributeName: sid, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # One-time passes (two minutes) that let a signed-in browser download the
  # dashboard's private files from /api/app/. Stored only as hashes.
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: atl-franchise-app-tickets
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tid, AttributeType: S }
      KeySchema:
        - { AttributeName: tid, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Random value CloudFront adds to every API request and the API checks, so
  # the API cannot be reached around CloudFront (and its firewall).
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: ATL franchise dashboard - CloudFront to API origin check
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # ------------------------------------------------------------------ login
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: atl-franchise-dashboard
      UserPoolTier: ESSENTIALS
      UsernameConfiguration:
        CaseSensitive: true            # "ATLWingSpotAdmin" exactly
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true # nobody can sign themselves up
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: admin_only, Priority: 1 } # no email on file; reset via create-admin.sh
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireNumbers: true
          RequireLowercase: false
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: !If [MfaOn, 'ON', 'OFF']
      EnabledMfas: !If [MfaOn, [SOFTWARE_TOKEN_MFA], !Ref AWS::NoValue]

  # The dashboard's own branded form signs in through Cognito's API
  # (USER_PASSWORD_AUTH over HTTPS). No OAuth redirects and no hosted page.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: dashboard
      UserPoolId: !Ref UserPool
      GenerateSecret: false            # a browser app cannot keep a secret
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 5           # minutes to finish an MFA or new-password step
      # Short-lived: a stolen access token is only good for 15 minutes. The page
      # refreshes quietly in the background.
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours

  # -------------------------------------------------------------------- API
  # Written out as plain API Gateway resources rather than SAM's HttpApi on
  # purpose. SAM puts the JWT authorizer inside the API definition, which makes
  # the API depend on the app client; the app client needs the CloudFront
  # address for its callback URL; CloudFront needs the API as an origin. That
  # loop cannot deploy. A separate Authorizer resource breaks it.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: atl-franchise-dashboard
      ProtocolType: HTTP

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        Audience: [!Ref UserPoolClient]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000

  # Every route requires a valid login token; there is no unauthenticated route.
  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/submissions
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  CreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/submissions
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/submissions/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  UpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PATCH /api/submissions/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  AppTicketRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/app-ticket
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  # The dashboard's own files. No JWT on this one route because a <script>
  # tag cannot send a header; the function checks the one-time pass cookie
  # instead and answers 404 to anything else.
  AppFileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/app/{file}
      AuthorizationType: NONE
      Target: !Sub integrations/${ApiIntegration}

  SessionsListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/sessions
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  SessionsRevokeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: DELETE /api/sessions/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  SessionsRevokeOthersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/sessions/revoke-others
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: atl-franchise-dashboard-api
      Description: Reads and updates franchise submissions for the dashboard.
      CodeUri: src/api/
      Handler: api.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          AUDIT_TABLE: !Ref AuditTable
          SESSIONS_TABLE: !Ref SessionsTable
          TICKETS_TABLE: !Ref TicketsTable
          ORIGIN_SECRET: !Sub '{{resolve:secretsmanager:${OriginSecret}}}'
      Policies:
        - Statement:
            # No DeleteItem anywhere: "archive" is a flag, so nothing can be
            # lost through the dashboard.
            - Sid: Submissions
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:PutItem]
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
            - Sid: Audit
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:Query]
              Resource: !GetAtt AuditTable.Arn
            - Sid: Sessions
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Scan]
              Resource: !GetAtt SessionsTable.Arn
            - Sid: AppTickets
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt TicketsTable.Arn

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 90

  # ---------------------------------------------------------------- website
  # Private bucket; only this CloudFront distribution can read it.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub atl-franchise-dashboard-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The Authorization header reaches the API only if it is part of the cache
  # key. Responses carry Cache-Control: no-store, so nothing is actually cached.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub atl-franchise-dashboard-api-${AWS::StackName}
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          QueryStringsConfig: { QueryStringBehavior: all }
          CookiesConfig: { CookieBehavior: none }

  # What reaches the API from the visitor: their browser (for the device log)
  # and where CloudFront saw them come from. Authorization is forwarded by
  # the cache policy above.
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub atl-franchise-dashboard-api-${AWS::StackName}
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Content-Type
            - User-Agent
            - CloudFront-Viewer-Address
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-Country-Region
            - CloudFront-Viewer-City
        QueryStringsConfig: { QueryStringBehavior: all }
        CookiesConfig: { CookieBehavior: none }

  # /api/app/: only the one-time pass cookie (and where the visitor is) goes
  # through. Never cached.
  AppOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub atl-franchise-dashboard-app-${AWS::StackName}
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [User-Agent, CloudFront-Viewer-Address]
        QueryStringsConfig: { QueryStringBehavior: none }
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies: [atl_app]

  # Only the sign-in page's own files are public. Any other path gets a bare 404 with
  # nothing in it, instead of S3's error document.
  PathGuard:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-path-guard
      AutoPublish: true
      FunctionConfig:
        Comment: ATL dashboard - known files only
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var FILES = { '/': 1, '/index.html': 1, '/signin.js': 1, '/styles.css': 1, '/config.js': 1, '/robots.txt': 1 };
        function handler(event) {
          var uri = event.request.uri;
          if (FILES[uri] === 1 || /^\/(brand|fonts)\/[a-z0-9-]+\.(png|woff2)$/.test(uri)) {
            return event.request;
          }
          return { statusCode: 404, statusDescription: 'Not Found', headers: { 'cache-control': { value: 'no-store' } } };
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub atl-franchise-dashboard-headers-${AWS::StackName}
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'none'; script-src 'self'; style-src 'self';
              img-src 'self' data:; font-src 'self';
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com;
              form-action 'self'; base-uri 'none'; frame-ancestors 'none';
              require-trusted-types-for 'script'; trusted-types atl-loader
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
            Preload: false
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: no-referrer }
        CustomHeadersConfig:
          Items:
            # Keep it out of search engines, caches, previews and image search.
            - { Header: X-Robots-Tag, Value: 'noindex, nofollow, noarchive, nosnippet, noimageindex', Override: true }
            - { Header: Permissions-Policy, Value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()', Override: true }
            - { Header: Cross-Origin-Opener-Policy, Value: same-origin, Override: true }
            - { Header: Cross-Origin-Resource-Policy, Value: same-origin, Override: true }
        RemoveHeadersConfig:
          Items:
            - { Header: Server }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          # CertificateArn is only used when DomainName is set, and the
          # DomainNeedsCertificate rule makes it a real ARN in that case.
          ignore_checks: [W1030]
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ATL Wing Spot franchise dashboard
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        WebACLId: !If [WafOn, !GetAtt DashboardWebAcl.Arn, !Ref AWS::NoValue]
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          # The API sits behind the same hostname under /api, so the browser
          # never makes a cross-origin call and no CORS is needed.
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}}}'
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PathGuard.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Listed before /api/*: CloudFront takes the first match.
          - PathPattern: /api/app/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref AppOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            Compress: true
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            Compress: true

  # ------------------------------------------------------------------- WAF
  # Dashboard (page and API, through CloudFront): per-IP rate limit, AWS's
  # bad-IP list, and known attack patterns.
  DashboardWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafOn
    Properties:
      Name: !Sub ${AWS::StackName}-site
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}-site
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 1000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: site-rate-limit }
        - Name: aws-ip-reputation
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: site-ip-reputation }
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: site-bad-inputs }

  # Login (Cognito, which the sign-in form calls directly): a tight per-IP
  # limit on top of Cognito's own lockout after repeated wrong passwords. A
  # person signing in makes a handful of calls; 30 in 5 minutes is a script.
  LoginWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafOn
    Properties:
      Name: !Sub ${AWS::StackName}-login
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}-login
      Rules:
        - Name: login-rate-limit-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 30
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: login-rate-limit }
        - Name: aws-ip-reputation
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: login-ip-reputation }

  LoginWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: WafOn
    Properties:
      ResourceArn: !GetAtt UserPool.Arn
      WebACLArn: !GetAtt LoginWebAcl.Arn

Outputs:
  DashboardUrl:
    Value: !If [HasDomain, !Sub 'https://${DomainName}/', !Sub 'https://${Distribution.DomainName}/']
  CloudFrontDomain:
    Description: Point the Cloudflare CNAME for the custom domain at this.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
