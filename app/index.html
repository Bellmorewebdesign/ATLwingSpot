<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22c1da" />

    <!-- The design is light-only. Without this, a phone in dark mode can repaint
         the page itself (Chrome's "darken websites", Samsung Internet, in-app
         browsers): the cream turns brown, the menu icon goes black on dark and
         brand colours shift. "only light" is the standard way to opt out.
         tokens.css says the same thing in CSS. -->
    <meta name="color-scheme" content="only light" />
    <!-- Every phone number on the site is already a tap-to-call link. This stops
         iOS Safari turning other digit runs (ZIPs, prices, years) into blue
         links of its own. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- ATL's own "atl" lozenge on a cyan tile inside the orange keyline from
         their basket stamp. Built by app/scripts/make-favicon.py straight from
         assets/brand/atl-wing-spot-logo.png. Paths are root-relative ("/assets/...")
         so they resolve from nested pages like /menu/ too. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/atl-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/brand/atl-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/atl-apple-touch-icon.png" />

    <!-- The title, description, canonical and og/twitter title, description
         and url below are the home page's. The build rewrites them for every
         page from app/src/data/routes.js (scripts/prerender-pages.mjs), so
         each page's own HTML carries its own before any JavaScript runs. -->
    <title>ATL Wing Spot | Fresh, Never Frozen Halal Wings. Stay Saucy.</title>
    <meta name="description" content="Fresh, never frozen wings fried to order in 25+ sauces. 100% halal. Voted best wings on Long Island. Order pickup or delivery across NY, NJ, PA, TX and CA." />
    <link rel="canonical" href="https://atlwingspot.com/" />
    <!-- Lets Google show the large photo beside a result instead of a thumbnail. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:url" content="https://atlwingspot.com/" />
    <meta property="og:title" content="ATL Wing Spot | Fresh, Never Frozen Halal Wings. Stay Saucy." />
    <meta property="og:description" content="Fresh, never frozen wings fried to order in 25+ sauces. 100% halal. Voted best wings on Long Island. Order pickup or delivery across NY, NJ, PA, TX and CA." />
    <meta property="og:image" content="https://atlwingspot.com/assets/food/hero-wings.jpg" />
    <meta property="og:image:width" content="1894" />
    <meta property="og:image:height" content="1078" />
    <meta property="og:image:alt" content="A basket of ATL Wing Spot wings" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="ATL Wing Spot" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATL Wing Spot | Fresh, Never Frozen Halal Wings. Stay Saucy." />
    <meta name="twitter:description" content="Fresh, never frozen wings fried to order in 25+ sauces. 100% halal. Voted best wings on Long Island. Order pickup or delivery across NY, NJ, PA, TX and CA." />
    <meta name="twitter:image" content="https://atlwingspot.com/assets/food/hero-wings.jpg" />
    <meta name="twitter:image:alt" content="A basket of ATL Wing Spot wings" />

    <!-- Structured data (JSON-LD) is written by the pages themselves, from
         the same data they show: see app/src/data/structuredData.js. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
